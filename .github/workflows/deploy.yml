name: 🚀 Deploy a GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Verificar archivos
        run: |
          echo "📁 Archivos en el repositorio:"
          find . -name "*.html" -not -path "./.git/*" | while read f; do
            size=$(du -sh "$f" | cut -f1)
            echo "  ✅ $f ($size)"
          done

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📦 Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🌐 Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
